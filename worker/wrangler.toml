# Настройки Cloudflare Worker: уведомление в Telegram, когда на сайте собрали сообщение (без данных о человеке).
# Cloudflare собирает воркер из этой папки: в настройках сборки Root directory = worker
#
# name должен совпадать с именем воркера в панели Cloudflare.
# При подключении репозитория Cloudflare по умолчанию называет воркер как репозиторий — egor-ivanov.
name = "egor-ivanov"
main = "telegram-form.js"
compatibility_date = "2025-09-01"

# адрес вида egor-ivanov.<логин>.workers.dev — на него отправляет форма сайта
workers_dev = true
# адреса предпросмотра *-egor-ivanov.<логин>.workers.dev (включены в панели)
preview_urls = true

# не стирать переменные, добавленные в панели Cloudflare, при каждом деплое
keep_vars = true

# Адреса сайта, с которых принимаются уведомления (через запятую)
[vars]
ALLOWED_ORIGIN = "https://ivanovdev.site, https://www.ivanovdev.site"

# Защита от накрутки: не больше 10 уведомлений в минуту на весь сайт (общий счётчик, IP не учитывается)
[[ratelimits]]
name = "FORM_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Журнал запросов в панели выключен: в нём сохранялись бы IP-адреса посетителей
[observability]
enabled = false

# BOT_TOKEN и CHAT_ID сюда НЕ писать — только в панели Cloudflare как Secret
# (Settings → Variables and Secrets), иначе токен окажется в открытом репозитории.
